
name: Publish Seishu Unyu Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate website files
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR=""
          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"
            if [ -f "$DIR/assets/style.css" ] && [ -f "$DIR/assets/site.js" ]; then
              SITE_DIR="$DIR"
              break
            fi
          done < <(find . -type f -name index.html -not -path './.git/*' | sort)

          if [ -z "$SITE_DIR" ]; then
            echo "::error::Website folder not found. Ensure index.html, assets/style.css and assets/site.js are together."
            find . -maxdepth 6 \( -name index.html -o -name style.css -o -name site.js \) -print
            exit 1
          fi

          echo "Publishing website from: $SITE_DIR"
          echo "site_dir=$SITE_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.locate.outputs.site_dir }}

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
