media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: site
    label: 連絡先と採用案内（簡単編集）
    type: file
    path: assets/content/site.json
    format: json
    fields:
      - name: phone
        label: 電話番号
        type: string
        required: true
      - name: fax
        label: FAX番号
        type: string
      - name: recruit_title
        label: 採用のお問い合わせ見出し
        type: string
      - name: recruit_description
        label: 採用のお問い合わせ説明文
        type: text
      - name: recruit_button
        label: 採用の問い合わせボタン
        type: string
      - name: contact_intro
        label: お問い合わせページの説明文
        type: text
      - name: contact_note
        label: お問い合わせの補足文
        type: text

  - name: news
    label: お知らせ投稿・編集
    type: file
    path: assets/content/news.json
    format: json
    list: true
    fields:
      - name: title
        label: 記事タイトル
        type: string
        required: true
      - name: date
        label: 投稿日
        type: date
        options:
          format: yyyy-MM-dd
      - name: category
        label: カテゴリー
        type: select
        options:
          values:
            - name: notice
              label: お知らせ
            - name: recruit
              label: 採用情報
            - name: press
              label: その他
      - name: body
        label: 本文（改行できます）
        type: text
      - name: published
        label: 公開する
        type: boolean
        default: false
